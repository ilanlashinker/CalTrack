name = "caltrack-estimate"
main = "estimate.js"
compatibility_date = "2024-11-01"

# CORS: only the app's own origin may call this Worker.
[vars]
ALLOWED_ORIGIN = "https://ilanlashinker.github.io"

# Create with: npx wrangler kv namespace create RATE_LIMIT
# then paste the returned id below.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "97ca92f316c74b5eb754e58d8c139c68"

# GEMINI_API_KEY is a secret, not a var — set it with:
#   npx wrangler secret put GEMINI_API_KEY
